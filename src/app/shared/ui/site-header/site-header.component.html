    <nav id="main-navigation" class="navigation" [class.navigation--open]="isMenuOpen()" aria-label="Navegação principal">
      <a href="#inicio" (click)="closeMenu()">Início</a><a href="#como-posso-ajudar" (click)="closeMenu()">Como posso ajudar</a><a href="#tcc" (click)="closeMenu()">TCC</a><a href="#sobre" (click)="closeMenu()">Sobre mim</a><a href="#duvidas" (click)="closeMenu()">Dúvidas</a>
      <app-whatsapp-cta label="Agendar conversa" />
    </nav>
  </div>
</header>
